name: Sync Packages

on:
  push:
    branches:
      - main

  schedule:
    # 每天北京时间 08:00
    # GitHub Actions 使用 UTC
    - cron: "0 0 * * *"

  workflow_dispatch:

# 防止多个同步任务同时修改仓库
concurrency:
  group: sync-packages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Sync OpenWrt Packages
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # Checkout OpenWrt source
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # Sync packages
      # ============================================================
      - name: Sync Packages
        shell: bash
        run: |
          set -Eeuo pipefail

          # --------------------------------------------------------
          # Git configuration
          # --------------------------------------------------------
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          # --------------------------------------------------------
          # Sync function
          #
          # $1 = upstream repository
          # $2 = destination directory
          # $3 = optional subdirectory
          # --------------------------------------------------------
          sync_repo() {
            local url="$1"
            local dest="$2"
            local subdir="${3:-}"

            local name
            name="$(basename "$url" .git)"

            local temp_dir
            temp_dir="$(mktemp -d "${RUNNER_TEMP}/${name}.XXXXXX")"

            echo
            echo "============================================================"
            echo "Syncing: ${name}"
            echo "URL:     ${url}"
            echo "Target:  ${dest}"
            echo "Subdir:  ${subdir:-<entire repository>}"
            echo "============================================================"

            # ------------------------------------------------------
            # Detect default branch
            # ------------------------------------------------------
            local branch

            branch="$(
              git ls-remote --symref "$url" HEAD |
              awk '/^ref:/ {
                sub("refs/heads/", "", $2)
                print $2
              }' |
              head -n 1
            )"

            if [[ -z "$branch" ]]; then
              echo "::error::Cannot detect default branch: $url"
              rm -rf "$temp_dir"
              return 1
            fi

            echo "Default branch: ${branch}"

            # ------------------------------------------------------
            # Full repository
            # ------------------------------------------------------
            if [[ -z "$subdir" ]]; then

              git clone \
                --depth=1 \
                --single-branch \
                --branch "$branch" \
                "$url" \
                "$temp_dir/repo"

              rm -rf "$temp_dir/repo/.git"

              # Atomic replacement
              rm -rf "$dest"
              mkdir -p "$(dirname "$dest")"
              mv "$temp_dir/repo" "$dest"

            else

              # ----------------------------------------------------
              # Sparse checkout
              # ----------------------------------------------------
              git clone \
                --depth=1 \
                --filter=blob:none \
                --sparse \
                --single-branch \
                --branch "$branch" \
                "$url" \
                "$temp_dir/repo"

              cd "$temp_dir/repo"

              git sparse-checkout set "$subdir"

              cd - >/dev/null

              # Verify directory
              if [[ ! -d "$temp_dir/repo/$subdir" ]]; then
                echo "::error::Directory does not exist: $subdir"
                rm -rf "$temp_dir"
                return 1
              fi

              rm -rf "$dest"
              mkdir -p "$(dirname "$dest")"

              mv "$temp_dir/repo/$subdir" "$dest"
            fi

            # ------------------------------------------------------
            # Cleanup
            # ------------------------------------------------------
            rm -rf "$temp_dir"
            rm -rf "$dest/.git"

            echo "Successfully synced: ${dest}"
          }

          # ========================================================
          # LuCI packages
          # ========================================================

          sync_repo \
            "https://github.com/gaoderby/luci-app-kms.git" \
            "luci-app-kms"

          sync_repo \
            "https://github.com/vernesong/OpenClash.git" \
            "luci-app-openclash" \
            "luci-app-openclash"

          sync_repo \
            "https://github.com/siwind/luci-app-wolplus.git" \
            "luci-app-wolplus"

          sync_repo \
            "https://github.com/jerrykuku/luci-theme-argon.git" \
            "luci-theme-argon"

          sync_repo \
            "https://github.com/sbwml/luci-app-mosdns.git" \
            "luci-app-mosdns"

          sync_repo \
            "https://github.com/immortalwrt/homeproxy.git" \
            "luci-app-homeproxy"

          # ========================================================
          # Passwall
          # ========================================================

          sync_repo \
            "https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git" \
            "passwall_packages"

          sync_repo \
            "https://github.com/Openwrt-Passwall/openwrt-passwall.git" \
            "passwall_luci"

          # ========================================================
          # Argon custom background
          # ========================================================

          echo
          echo "Installing custom Argon background..."

          if [[ ! -f "background/bg1.jpg" ]]; then
            echo "::error::background/bg1.jpg not found"
            exit 1
          fi

          mkdir -p \
            "luci-theme-argon/htdocs/luci-static/argon/background"

          cp -f \
            "background/bg1.jpg" \
            "luci-theme-argon/htdocs/luci-static/argon/background/bg1.jpg"

          echo "Custom Argon background installed."
      
      # ============================================================
      # Customize luci-app-wolplus
      # ============================================================
      - name: Customize luci-app-wolplus
        shell: bash
        run: |
          set -Eeuo pipefail

          WOLPLUS_DIR="luci-app-wolplus"

          WOLPLUS_LUA="${WOLPLUS_DIR}/luasrc/controller/wolplus.lua"
          WOLPLUS_ZH_CN="${WOLPLUS_DIR}/po/zh-cn/wolplus.po"
          WOLPLUS_ZH_HANS="${WOLPLUS_DIR}/po/zh_Hans/wolplus.po"

          echo "============================================================"
          echo "Customizing luci-app-wolplus"
          echo "============================================================"

          # 检查文件是否存在
          for file in \
            "$WOLPLUS_LUA" \
            "$WOLPLUS_ZH_CN" \
            "$WOLPLUS_ZH_HANS"
          do
            if [[ ! -f "$file" ]]; then
              echo "::error::File not found: $file"
              exit 1
            fi
          done

          # 修改菜单名称
          sed -i \
            's/_("wolplus")/_("Wake on LAN")/g' \
            "$WOLPLUS_LUA"

          # 修改英文标识
          sed -i \
            's/wolplus/Wake on LAN/g' \
            "$WOLPLUS_ZH_CN"

          sed -i \
            's/wolplus/Wake on LAN/g' \
            "$WOLPLUS_ZH_HANS"

          # 网络唤醒Plus → 网络唤醒
          sed -i \
            's/网络唤醒Plus/网络唤醒/g' \
            "$WOLPLUS_ZH_CN"

          sed -i \
            's/网络唤醒Plus/网络唤醒/g' \
            "$WOLPLUS_ZH_HANS"

          # 网络唤醒Plus-增强版 → 网络唤醒-增强版
          sed -i \
            's/网络唤醒Plus-增强版/网络唤醒-增强版/g' \
            "$WOLPLUS_ZH_CN"

          sed -i \
            's/网络唤醒Plus-增强版/网络唤醒-增强版/g' \
            "$WOLPLUS_ZH_HANS"

          echo "Customization completed."

          # 显示修改结果
          echo
          echo "Changes:"
          git diff -- \
            "$WOLPLUS_LUA" \
            "$WOLPLUS_ZH_CN" \
            "$WOLPLUS_ZH_HANS"

      # ============================================================
      # Customize luci-app-vlmcsd
      # ============================================================
      - name: Customize luci-app-vlmcsd
        shell: bash
        run: |
          set -Eeuo pipefail

          VLMCS_DIR="luci-app-vlmcsd"

          VLMCS_MENU="${VLMCS_DIR}/root/usr/share/luci/menu.d/luci-app-vlmcsd.json"
          VLMCS_PO="${VLMCS_DIR}/po/zh_Hans/vlmcsd.po"

          echo "============================================================"
          echo "Customizing luci-app-vlmcsd"
          echo "============================================================"

          # --------------------------------------------------------
          # 检查文件
          # --------------------------------------------------------

          for file in \
            "$VLMCS_MENU" \
            "$VLMCS_PO"
          do
            if [[ ! -f "$file" ]]; then
              echo "::error::File not found: $file"
              exit 1
            fi
          done

          # --------------------------------------------------------
          # 修改 LuCI 菜单名称
          #
          # "title": "Vlmcsd KMS Server"
          #       ↓
          # "title": "KMS Server"
          # --------------------------------------------------------

          sed -i \
            's/"title": "Vlmcsd KMS Server"/"title": "KMS Server"/' \
            "$VLMCS_MENU"

          # --------------------------------------------------------
          # 修改中文翻译
          #
          # msgid "Vlmcsd KMS Server"
          # msgstr "Vlmcsd KMS 服务器"
          #
          #       ↓
          #
          # msgid "KMS Server"
          # msgstr "KMS 服务器"
          # --------------------------------------------------------

          sed -i \
            '/^msgid "Vlmcsd KMS Server"$/,/^msgstr / s/^msgstr "Vlmcsd KMS 服务器"$/msgstr "KMS 服务器"/' \
            "$VLMCS_PO"

          sed -i \
            '/^msgid "Vlmcsd KMS Server"$/ s/^msgid "Vlmcsd KMS Server"$/msgid "KMS Server"/' \
            "$VLMCS_PO"

          # --------------------------------------------------------
          # 显示修改内容
          # --------------------------------------------------------

          echo
          echo "============================================================"
          echo "luci-app-vlmcsd changes"
          echo "============================================================"

          git diff -- \
            "$VLMCS_MENU" \
            "$VLMCS_PO"

      # ============================================================
      # Install Clash Meta core for ARM64
      # ============================================================
      - name: Install Clash Meta ARM64 core
        shell: bash
        run: |
          set -Eeuo pipefail

          OPENCLASH_DIR="luci-app-openclash"
          CORE_DIR="${OPENCLASH_DIR}/root/etc/openclash/core"

          CLASH_URL="https://github.com/vernesong/OpenClash/raw/core/master/meta/clash-linux-arm64.tar.gz"
          CLASH_ARCHIVE="/tmp/clash-linux-arm64.tar.gz"
          CLASH_TEMP="/tmp/clash-meta"

          echo "============================================================"
          echo "Installing Clash Meta ARM64 core"
          echo "============================================================"

          # --------------------------------------------------------
          # 检查 OpenClash
          # --------------------------------------------------------

          if [[ ! -d "$OPENCLASH_DIR" ]]; then
            echo "::error::OpenClash directory not found: $OPENCLASH_DIR"
            exit 1
          fi

          # --------------------------------------------------------
          # 创建临时目录
          # --------------------------------------------------------

          rm -rf "$CLASH_TEMP"
          mkdir -p "$CLASH_TEMP"

          # --------------------------------------------------------
          # 下载 Clash Meta ARM64
          # --------------------------------------------------------

          echo "Downloading Clash Meta ARM64..."

          curl \
            -fL \
            --connect-timeout 30 \
            --max-time 120 \
            --retry 3 \
            --retry-delay 5 \
            -o "$CLASH_ARCHIVE" \
            "$CLASH_URL"

          # --------------------------------------------------------
          # 检查下载文件
          # --------------------------------------------------------

          if [[ ! -s "$CLASH_ARCHIVE" ]]; then
            echo "::error::Clash Meta archive is empty."
            exit 1
          fi

          echo "Downloaded:"
          ls -lh "$CLASH_ARCHIVE"

          # --------------------------------------------------------
          # 解压 Clash Meta
          # --------------------------------------------------------

          echo "Extracting Clash Meta..."

          tar -xzf "$CLASH_ARCHIVE" \
            -C "$CLASH_TEMP"

          # --------------------------------------------------------
          # 检查核心文件
          # --------------------------------------------------------

          if [[ ! -f "$CLASH_TEMP/clash" ]]; then
            echo "::error::Clash Meta binary not found."
            echo "Extracted files:"
            find "$CLASH_TEMP" -maxdepth 2 -type f -print
            exit 1
          fi

          # --------------------------------------------------------
          # 设置执行权限
          # --------------------------------------------------------

          chmod +x "$CLASH_TEMP/clash"

          # --------------------------------------------------------
          # 安装 Clash Meta
          # --------------------------------------------------------

          mkdir -p "$CORE_DIR"

          rm -f "$CORE_DIR/clash_meta"

          mv \
            "$CLASH_TEMP/clash" \
            "$CORE_DIR/clash_meta"

          chmod +x "$CORE_DIR/clash_meta"

          # --------------------------------------------------------
          # 验证
          # --------------------------------------------------------

          echo
          echo "Clash Meta core:"
          ls -lh "$CORE_DIR/clash_meta"

          file "$CORE_DIR/clash_meta"

          # --------------------------------------------------------
          # 清理
          # --------------------------------------------------------

          rm -rf \
            "$CLASH_ARCHIVE" \
            "$CLASH_TEMP"

          echo
          echo "Clash Meta ARM64 core installation completed."

      # ============================================================
      # Commit
      # ============================================================
      - name: Commit and Push
        shell: bash
        run: |
          set -Eeuo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          echo
          echo "Changed files:"
          git diff --cached --stat

          git commit \
            -m "Auto Sync: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          git push origin HEAD:main
